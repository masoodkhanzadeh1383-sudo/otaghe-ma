name: Build Otaghe Ma APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) -print

        - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

            - name: List Gradle tasks
        run: |
          gradle :app:tasks --all

      - name: Find APK
        run: |
          echo "===== GENERATED APK ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtagheMa-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
