name: Build Otaghe Ma APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo ""
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "settings.gradle" \) -print

      - name: Find Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found in root."
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew was not found."
            echo "The project needs a Gradle wrapper."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== GENERATED APK ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtagheMa-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
