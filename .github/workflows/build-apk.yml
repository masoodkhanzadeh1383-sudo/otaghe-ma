name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "===== ROOT FILES ====="
          ls -la

          echo "===== APP ZIP ====="
          ls -lh app.zip

      - name: Extract app.zip
        run: |
          echo "===== EXTRACTING APP.ZIP ====="

          rm -rf extracted_app
          mkdir -p extracted_app

          unzip -q app.zip -d extracted_app

          echo "===== EXTRACTED FILES ====="
          find extracted_app -maxdepth 3 -type f | head -100

          if [ -d "extracted_app/app" ]; then
            echo "Found app/ inside ZIP"
            rm -rf app
            mv extracted_app/app app
          else
            echo "No app/ folder inside ZIP"
            echo "Putting ZIP contents into app/"
            rm -rf app
            mkdir -p app
            cp -r extracted_app/. app/
          fi

          echo "===== APP FOLDER ====="
          find app -maxdepth 3 -type f | head -100

      - name: Check Gradle files
        run: |
          echo "===== GRADLE FILES ====="

          find . -maxdepth 4 -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \
          \) -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle tasks
        run: |
          echo "===== GRADLE TASKS ====="
          gradle :app:tasks --all

      - name: Build Debug APK
        run: |
          echo "===== BUILDING APK ====="
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        if: always()
        run: |
          echo "===== GENERATED APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
