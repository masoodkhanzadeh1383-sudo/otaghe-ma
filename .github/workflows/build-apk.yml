name: Build Otaghe Ma APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check project files
        run: |
          echo "Checking Otaghe Ma project..."
          test -d OtagheMa_v3_cloud
          test -f OtagheMa_v3_cloud/gradlew

      - name: Check google-services.json
        run: |
          test -f OtagheMa_v3_cloud/app/google-services.json

      - name: Make Gradle executable
        run: |
          chmod +x OtagheMa_v3_cloud/gradlew

      - name: Build Debug APK
        run: |
          cd OtagheMa_v3_cloud
          ./gradlew :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          test -f OtagheMa_v3_cloud/app/build/outputs/apk/debug/app-debug.apk
          ls -lh OtagheMa_v3_cloud/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtagheMa-debug-apk
          path: OtagheMa_v3_cloud/app/build/outputs/apk/debug/app-debug.apk
